<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>南林电力守夜</title>
    <link rel="icon" href="./assets/njfu-power-alert.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="./assets/njfu-power-alert.png" alt="">
        <div>
          <h1>南林电力守夜</h1>
          <p>10栋717 · <span id="updatedAt">等待第一次采集</span><span id="previousUpdatedAt"></span></p>
        </div>
      </div>
      <div class="status-pill" id="statusPill">未加载</div>
    </header>

    <main>
      <section class="balance-grid" id="balances"></section>

      <section class="usage-grid">
        <article class="panel usage-panel">
          <div class="panel-head">
            <h2>日耗趋势</h2>
            <div class="panel-controls">
              <div class="legend">
                <span><i class="legend-dot lighting"></i>照明</span>
                <span><i class="legend-dot ac"></i>空调</span>
              </div>
              <label class="range-control" for="rangeDays">显示
                <select id="rangeDays">
                  <option value="7">最近 7 天</option>
                  <option value="14" selected>最近 14 天</option>
                </select>
              </label>
            </div>
          </div>
          <div class="chart-wrap" id="dailyChartWrap">
            <canvas id="dailyLineChart" height="320"></canvas>
            <div class="chart-tooltip" id="chartTooltip" role="status" hidden></div>
          </div>
          <div class="daily-summary" id="dailySummary"></div>
        </article>

        <article class="panel usage-panel">
          <div class="panel-head">
            <h2>用电占比</h2>
            <p class="panel-note" id="rangeNote">最近 14 天</p>
          </div>
          <canvas id="usagePieChart" height="320"></canvas>
          <div class="daily-summary" id="pieSummary"></div>
        </article>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
