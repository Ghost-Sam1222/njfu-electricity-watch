name: Electricity Watch

on:
  schedule:
    # UTC 00:05 / 14:05 = Beijing 08:05 / 22:05.
    - cron: "5 0,14 * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Only test network access; do not query balances or commit data"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Diagnose network
        if: ${{ inputs.diagnose == 'true' }}
        env:
          NODE_OPTIONS: --use-env-proxy
          SYNJONES_AUTH: ${{ secrets.SYNJONES_AUTH }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          NO_PROXY: ${{ vars.NO_PROXY }}
        run: npm run diagnose

      - name: Query electricity balances
        if: ${{ inputs.diagnose != 'true' }}
        env:
          NODE_OPTIONS: --use-env-proxy
          SYNJONES_AUTH: ${{ secrets.SYNJONES_AUTH }}
          BARK_URL: ${{ secrets.BARK_URL }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          NO_PROXY: ${{ vars.NO_PROXY }}
        run: npm run query

      - name: Commit updated data
        if: ${{ inputs.diagnose != 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update electricity data"
          file_pattern: "docs/data/*.json"
