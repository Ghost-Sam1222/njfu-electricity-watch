name: Electricity Watch

on:
  schedule:
    # UTC 00:05 / 14:05 = Beijing 08:05 / 22:05.
    - cron: "5 0,14 * * *"
  workflow_dispatch:
    inputs:
      diagnose:
        description: "Only test network access; do not query balances or commit data"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  query:
    runs-on: ubuntu-latest
    env:
      HAS_CLASH_CONFIG: ${{ secrets.CLASH_CONFIG_YAML != '' }}
      HAS_CLASH_SUBSCRIPTION: ${{ secrets.CLASH_SUBSCRIPTION_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Start Mihomo proxy
        id: mihomo
        if: ${{ env.HAS_CLASH_CONFIG == 'true' || env.HAS_CLASH_SUBSCRIPTION == 'true' }}
        env:
          CLASH_CONFIG_YAML: ${{ secrets.CLASH_CONFIG_YAML }}
          CLASH_SUBSCRIPTION_URL: ${{ secrets.CLASH_SUBSCRIPTION_URL }}
        run: bash scripts/setup-mihomo.sh

      - name: Diagnose network
        if: ${{ inputs.diagnose == 'true' }}
        env:
          NODE_OPTIONS: --use-env-proxy
          SYNJONES_AUTH: ${{ secrets.SYNJONES_AUTH }}
          HTTPS_PROXY: ${{ steps.mihomo.outputs.proxy || secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ steps.mihomo.outputs.proxy || secrets.HTTP_PROXY }}
          NO_PROXY: ${{ vars.NO_PROXY }}
        run: npm run diagnose

      - name: Query electricity balances
        id: electricity_query
        if: ${{ inputs.diagnose != 'true' }}
        env:
          NODE_OPTIONS: --use-env-proxy
          SYNJONES_AUTH: ${{ secrets.SYNJONES_AUTH }}
          BARK_URL: ${{ secrets.BARK_URL }}
          BARK_ICON_URL: https://ghost-sam1222.github.io/njfu-electricity-watch/assets/njfu-power-alert.png
          HTTPS_PROXY: ${{ steps.mihomo.outputs.proxy || secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ steps.mihomo.outputs.proxy || secrets.HTTP_PROXY }}
          NO_PROXY: ${{ vars.NO_PROXY }}
        run: npm run query

      - name: Commit updated data
        if: ${{ success() && inputs.diagnose != 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update electricity data"
          file_pattern: "docs/data/*.json"

      - name: Mark collection failure
        if: ${{ always() && inputs.diagnose != 'true' && steps.electricity_query.outcome != 'success' }}
        run: npm run mark:collection-failed

      - name: Commit failed collection status
        if: ${{ always() && inputs.diagnose != 'true' && steps.electricity_query.outcome != 'success' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: mark electricity collection failure"
          file_pattern: "docs/data/latest.json"
